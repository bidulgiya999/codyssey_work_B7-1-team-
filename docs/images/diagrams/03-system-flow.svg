<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758a"/></marker></defs><rect x="0" y="0" width="2000" height="1300" rx="0" fill="#f5f8fc" stroke="none" stroke-width="2"/><rect x="0" y="0" width="2000" height="205" rx="0" fill="#15263f" stroke="none" stroke-width="2"/><text x="80" y="56" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#a8c6ff" text-anchor="start">PULSE  /  PROJECT DIAGRAMS  /  03</text><text x="80" y="118" font-family="Malgun Gothic, sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="start">시스템 구조 · 채팅 처리 흐름</text><text x="80" y="166" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#c7d5e8" text-anchor="start">로그인 사용자 기준  ·  최근 성공 대화 5쌍과 외부 자료를 함께 AI에 전달합니다.</text><polyline points="80,1220 1920,1220" fill="none" stroke="#d9e3ef" stroke-width="2" stroke-linejoin="round"/><text x="80" y="1260" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#63758a" text-anchor="start">기준: 현재 저장소 코드·README  |  2026.10.06</text><text x="1920" y="1260" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#63758a" text-anchor="end">PULSE  ·  03 / 04</text><rect x="80" y="260" width="520" height="218" rx="18" fill="white" stroke="#d7e2ef" stroke-width="2"/><rect x="80" y="260" width="7" height="218" rx="3" fill="#bd6a20" stroke="none" stroke-width="2"/><text x="105" y="309" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" fill="#bd6a20" text-anchor="start">01  질문 전송 · D UI</text><text x="105" y="354" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">Q1~Q5 모드 선택 · 질문 입력</text><text x="105" y="392" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">POST /api/chat + 세션 쿠키</text><text x="105" y="430" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">Q2는 과거 업로드 주제를 함께 전송</text><rect x="740" y="260" width="520" height="218" rx="18" fill="white" stroke="#d7e2ef" stroke-width="2"/><rect x="740" y="260" width="7" height="218" rx="3" fill="#3067d7" stroke="none" stroke-width="2"/><text x="765" y="309" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" fill="#3067d7" text-anchor="start">02  인증·입력 검증 · A / C</text><text x="765" y="354" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">세션 user_id → 실제 사용자 확인</text><text x="765" y="392" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">mode · 질문 길이 1~500자 검증</text><text x="765" y="430" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">인증 실패 401 · 입력 오류 422</text><rect x="1400" y="260" width="520" height="218" rx="18" fill="white" stroke="#d7e2ef" stroke-width="2"/><rect x="1400" y="260" width="7" height="218" rx="3" fill="#7956bd" stroke="none" stroke-width="2"/><text x="1425" y="309" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" fill="#7956bd" text-anchor="start">03  대화 문맥 조회 · C</text><text x="1425" y="354" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">SQLite에서 본인 기록만 조회</text><text x="1425" y="392" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">성공·답변 있는 최근 5쌍</text><text x="1425" y="430" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">시간순 user / assistant 메시지 구성</text><rect x="1400" y="560" width="520" height="218" rx="18" fill="white" stroke="#d7e2ef" stroke-width="2"/><rect x="1400" y="560" width="7" height="218" rx="3" fill="#098875" stroke="none" stroke-width="2"/><text x="1425" y="609" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" fill="#098875" text-anchor="start">04  시나리오 자료 구성 · B / C</text><text x="1425" y="654" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">모드별 system 프롬프트 생성</text><text x="1425" y="692" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">필요한 뉴스·검색 추이 조회</text><text x="1425" y="730" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">자료 부족·조회 실패 한계를 명시</text><rect x="740" y="560" width="520" height="218" rx="18" fill="white" stroke="#d7e2ef" stroke-width="2"/><rect x="740" y="560" width="7" height="218" rx="3" fill="#7956bd" stroke="none" stroke-width="2"/><text x="765" y="609" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" fill="#7956bd" text-anchor="start">05  AI 호출 · C</text><text x="765" y="654" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">system + 이전 대화 + 현재 질문</text><text x="765" y="692" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">Codyssey LLM API 1회 호출</text><text x="765" y="730" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">success / timeout / error 결정</text><rect x="80" y="560" width="520" height="218" rx="18" fill="white" stroke="#d7e2ef" stroke-width="2"/><rect x="80" y="560" width="7" height="218" rx="3" fill="#3067d7" stroke="none" stroke-width="2"/><text x="105" y="609" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" fill="#3067d7" text-anchor="start">06  대화 기록 저장 · C</text><text x="105" y="654" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">user_id · mode · 질문 · 답변 · 상태</text><text x="105" y="692" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">AI 실패도 answer=NULL로 저장</text><text x="105" y="730" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">DB 저장 실패: rollback → 500</text><rect x="80" y="860" width="520" height="218" rx="18" fill="white" stroke="#d7e2ef" stroke-width="2"/><rect x="80" y="860" width="7" height="218" rx="3" fill="#bd6a20" stroke="none" stroke-width="2"/><text x="105" y="909" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" fill="#bd6a20" text-anchor="start">07  결과 표시 · D UI</text><text x="105" y="954" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">DB commit 후 응답 반환</text><text x="105" y="992" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">성공 200 · AI timeout 504 · error 502</text><text x="105" y="1030" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">같은 화면에 답변·오류 표시</text><rect x="740" y="860" width="520" height="218" rx="18" fill="white" stroke="#d7e2ef" stroke-width="2"/><rect x="740" y="860" width="7" height="218" rx="3" fill="#bd6a20" stroke="none" stroke-width="2"/><text x="765" y="909" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" fill="#bd6a20" text-anchor="start">08  내 기록 조회 · D</text><text x="765" y="954" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">GET /api/me/chats?limit=20</text><text x="765" y="992" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">인증된 본인 기록만 최신순 반환</text><text x="765" y="1030" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#22354f" text-anchor="start">기본 20개 · 최대 100개</text><polyline points="600,370 740,370" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1260,370 1400,370" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1660,478 1660,560" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1400,670 1260,670" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="740,670 600,670" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="340,778 340,860" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="600,970 740,970" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="670" y="951" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#63758a" text-anchor="middle">별도 요청</text><rect x="1400" y="860" width="520" height="218" rx="18" fill="white" stroke="#d7e2ef" stroke-width="2"/><rect x="1400" y="860" width="7" height="218" rx="3" fill="#15263f" stroke="none" stroke-width="2"/><text x="1425" y="909" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" fill="#15263f" text-anchor="start">DB에서 지키는 경계</text><text x="1425" y="954" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#22354f" text-anchor="start">모든 대화는 users.id와 FK로 연결</text><text x="1425" y="992" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#22354f" text-anchor="start">사용자 ID는 세션 인증 결과 사용</text><text x="1425" y="1030" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#22354f" text-anchor="start">기록 조회·문맥 조회 모두 본인으로 제한</text><text x="80" y="1150" font-family="Malgun Gothic, sans-serif" font-size="26" font-weight="700" fill="#22354f" text-anchor="start">현재 화면 번호: Q1 오늘의 주제  ·  Q2 운영 채널 추천  ·  Q3 타이밍 체크  ·  Q4 새로운 각도  ·  Q5 다음 편 기획</text></svg>